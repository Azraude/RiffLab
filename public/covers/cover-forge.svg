<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Cover Forge — RiffLab default">
  <defs>
    <linearGradient id="forge-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="0.55" stop-color="#141414"/>
      <stop offset="1" stop-color="#1c1c1c"/>
    </linearGradient>
    <radialGradient id="forge-glow" cx="0.78" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#d4685e" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#d4b76a" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="forge-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a8454" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#d4b76a"/>
      <stop offset="0.6" stop-color="#f5d97a"/>
      <stop offset="1" stop-color="#9a8454" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#forge-bg)"/>
  <rect width="1200" height="400" fill="url(#forge-glow)"/>
  <!-- Lignes dorées qui parcourent comme des étincelles -->
  <g stroke="url(#forge-line)" stroke-linecap="round" fill="none">
    <path d="M0 80 L1200 130" stroke-width="1.2" opacity="0.65"/>
    <path d="M0 160 L1200 200" stroke-width="0.8" opacity="0.5"/>
    <path d="M0 230 L1200 270" stroke-width="1.6" opacity="0.7"/>
    <path d="M0 305 L1200 340" stroke-width="0.6" opacity="0.45"/>
  </g>
  <!-- Particules flammes (cercles dorés) -->
  <g fill="#f5d97a">
    <circle cx="980" cy="310" r="2.5" opacity="0.85"/>
    <circle cx="1040" cy="270" r="1.8" opacity="0.7"/>
    <circle cx="1090" cy="220" r="2" opacity="0.6"/>
    <circle cx="900" cy="280" r="1.2" opacity="0.5"/>
    <circle cx="1130" cy="170" r="1.5" opacity="0.55"/>
    <circle cx="950" cy="190" r="1" opacity="0.4"/>
    <circle cx="1010" cy="350" r="3" opacity="0.9"/>
  </g>
  <!-- Watermark logo subtil bas-droite -->
  <text x="1170" y="385" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#9a8454" opacity="0.55" text-anchor="end" letter-spacing="2">RIFFLAB</text>
</svg>
