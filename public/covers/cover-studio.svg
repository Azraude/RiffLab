<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Cover Studio — RiffLab">
  <defs>
    <linearGradient id="studio-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
    <radialGradient id="studio-spot" cx="0.5" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#d4b76a" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#studio-bg)"/>
  <rect width="1200" height="400" fill="url(#studio-spot)"/>
  <!-- Silhouette ampli central -->
  <g transform="translate(540 110)">
    <rect x="0" y="0" width="120" height="180" rx="8" fill="#1c1c1c" stroke="#d4b76a" stroke-width="1.5" opacity="0.92"/>
    <!-- Grille tweed (lignes diagonales) -->
    <g stroke="#9a8454" stroke-width="0.4" opacity="0.5">
      <line x1="8" y1="20" x2="112" y2="20"/>
      <line x1="8" y1="40" x2="112" y2="40"/>
      <line x1="8" y1="60" x2="112" y2="60"/>
      <line x1="8" y1="80" x2="112" y2="80"/>
      <line x1="8" y1="100" x2="112" y2="100"/>
      <line x1="8" y1="120" x2="112" y2="120"/>
    </g>
    <!-- Knobs -->
    <circle cx="30" cy="155" r="6" fill="#d4b76a" opacity="0.75"/>
    <circle cx="60" cy="155" r="6" fill="#d4b76a" opacity="0.75"/>
    <circle cx="90" cy="155" r="6" fill="#d4b76a" opacity="0.75"/>
    <!-- Logo plate -->
    <rect x="38" y="145" width="44" height="3" fill="#f5d97a" opacity="0.85"/>
  </g>
  <!-- Casque audio à gauche -->
  <g transform="translate(180 140)" stroke="#d4b76a" stroke-width="2.5" fill="none" opacity="0.7">
    <path d="M0 50 Q0 0 80 0 Q160 0 160 50"/>
    <ellipse cx="0" cy="70" rx="18" ry="28" fill="#1c1c1c" stroke="#d4b76a"/>
    <ellipse cx="160" cy="70" rx="18" ry="28" fill="#1c1c1c" stroke="#d4b76a"/>
  </g>
  <!-- Ondes sonores droite (3 arcs) -->
  <g transform="translate(880 200)" stroke="#f5d97a" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M0 -40 Q30 0 0 40" stroke-width="2"/>
    <path d="M30 -55 Q70 0 30 55" stroke-width="1.5" opacity="0.7"/>
    <path d="M60 -68 Q110 0 60 68" stroke-width="1" opacity="0.5"/>
  </g>
  <text x="1170" y="385" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#9a8454" opacity="0.55" text-anchor="end" letter-spacing="2">RIFFLAB</text>
</svg>
