<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Cover Néon — RiffLab">
  <defs>
    <linearGradient id="neon-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="0.5" stop-color="#0f0f10"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="400" fill="url(#neon-bg)"/>
  <!-- Lignes géométriques néon dorées (rectangles imbriqués) -->
  <g fill="none" stroke="#f5d97a" filter="url(#neon-glow)">
    <rect x="40" y="40" width="1120" height="320" stroke-width="1.5" opacity="0.85"/>
    <rect x="100" y="80" width="1000" height="240" stroke-width="1.2" opacity="0.55"/>
    <rect x="180" y="130" width="840" height="140" stroke-width="1" opacity="0.4"/>
  </g>
  <!-- Diagonales croisées -->
  <g stroke="#d4b76a" stroke-width="0.8" opacity="0.35" filter="url(#neon-glow)">
    <line x1="40" y1="40" x2="1160" y2="360"/>
    <line x1="1160" y1="40" x2="40" y2="360"/>
  </g>
  <!-- Pulse central -->
  <circle cx="600" cy="200" r="80" fill="none" stroke="#f5d97a" stroke-width="1.5" opacity="0.4" filter="url(#neon-glow)"/>
  <circle cx="600" cy="200" r="40" fill="none" stroke="#f5d97a" stroke-width="2" opacity="0.7" filter="url(#neon-glow)"/>
  <circle cx="600" cy="200" r="4" fill="#f5d97a" filter="url(#neon-glow)"/>
  <text x="1170" y="385" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#9a8454" opacity="0.55" text-anchor="end" letter-spacing="2">RIFFLAB</text>
</svg>
