<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Cover Manche — RiffLab">
  <defs>
    <linearGradient id="manche-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f0f10"/>
      <stop offset="1" stop-color="#1c1c1c"/>
    </linearGradient>
    <linearGradient id="manche-string" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a8454"/>
      <stop offset="0.5" stop-color="#f5d97a"/>
      <stop offset="1" stop-color="#9a8454"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#manche-bg)"/>
  <!-- 6 cordes horizontales (manche) -->
  <g stroke="url(#manche-string)" stroke-linecap="round" fill="none">
    <line x1="0" y1="120" x2="1200" y2="120" stroke-width="0.8" opacity="0.5"/>
    <line x1="0" y1="160" x2="1200" y2="160" stroke-width="1.1" opacity="0.65"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke-width="1.4" opacity="0.8"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke-width="1.8" opacity="0.9"/>
    <line x1="0" y1="280" x2="1200" y2="280" stroke-width="2.2" opacity="0.95"/>
    <line x1="0" y1="320" x2="1200" y2="320" stroke-width="2.8" opacity="1"/>
  </g>
  <!-- Frets verticaux dorés -->
  <g stroke="#d4b76a" opacity="0.35">
    <line x1="180" y1="80" x2="180" y2="360" stroke-width="2"/>
    <line x1="380" y1="80" x2="380" y2="360" stroke-width="2"/>
    <line x1="580" y1="80" x2="580" y2="360" stroke-width="2"/>
    <line x1="780" y1="80" x2="780" y2="360" stroke-width="2"/>
    <line x1="980" y1="80" x2="980" y2="360" stroke-width="2"/>
  </g>
  <!-- Inlays dots nacre clair (frets 3, 5, 7, 9) -->
  <g fill="#e8e2d2">
    <circle cx="280" cy="220" r="4" opacity="0.8"/>
    <circle cx="480" cy="220" r="4" opacity="0.8"/>
    <circle cx="680" cy="220" r="4" opacity="0.8"/>
    <circle cx="880" cy="200" r="4" opacity="0.8"/>
    <circle cx="880" cy="240" r="4" opacity="0.8"/>
  </g>
  <text x="1170" y="385" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#9a8454" opacity="0.55" text-anchor="end" letter-spacing="2">RIFFLAB</text>
</svg>
