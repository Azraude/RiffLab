<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Cover Vintage — RiffLab">
  <defs>
    <linearGradient id="vint-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1a14"/>
      <stop offset="0.5" stop-color="#1a1108"/>
      <stop offset="1" stop-color="#100904"/>
    </linearGradient>
    <radialGradient id="vint-shine" cx="0.3" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#d4b76a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="vint-stitch" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20 L40 20" stroke="#9a8454" stroke-width="0.4" stroke-dasharray="6 6" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" fill="url(#vint-bg)"/>
  <rect width="1200" height="400" fill="url(#vint-shine)"/>
  <!-- Texture cuir : pattern de petits points sombres -->
  <g fill="#0a0a0a" opacity="0.4">
    <circle cx="80" cy="60" r="1"/>
    <circle cx="180" cy="120" r="1.2"/>
    <circle cx="320" cy="80" r="0.8"/>
    <circle cx="460" cy="180" r="1"/>
    <circle cx="620" cy="100" r="1.4"/>
    <circle cx="780" cy="220" r="0.9"/>
    <circle cx="900" cy="160" r="1.1"/>
    <circle cx="1050" cy="280" r="1"/>
    <circle cx="240" cy="340" r="1.3"/>
    <circle cx="540" cy="320" r="0.8"/>
    <circle cx="700" cy="280" r="1"/>
    <circle cx="1120" cy="100" r="1.2"/>
    <circle cx="120" cy="280" r="1"/>
    <circle cx="380" cy="240" r="0.8"/>
    <circle cx="560" cy="60" r="0.9"/>
    <circle cx="820" cy="60" r="1.1"/>
    <circle cx="1000" cy="40" r="0.9"/>
  </g>
  <!-- Bandes de couture style cuir cousue -->
  <rect x="40" y="40" width="1120" height="320" fill="none" stroke="#9a8454" stroke-width="1" opacity="0.5"/>
  <rect x="40" y="40" width="1120" height="320" fill="url(#vint-stitch)"/>
  <!-- Reflets dorés (formes blob) -->
  <ellipse cx="900" cy="120" rx="220" ry="60" fill="#d4b76a" opacity="0.08"/>
  <ellipse cx="280" cy="300" rx="160" ry="40" fill="#d4b76a" opacity="0.06"/>
  <text x="1170" y="385" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#d4b76a" opacity="0.65" text-anchor="end" letter-spacing="2">RIFFLAB</text>
</svg>
